version: "3.8"

# ML syslog analytics stack for a single VM, sized for ~500 devices / 10M+ log
# lines per day. Runs alongside your existing rsyslog + LogAnalyzer setup —
# nothing here touches that pipeline, it only taps a copy of the stream.
#
# Components:
#   redpanda   - Kafka-API compatible broker (single binary, far lighter than
#                Kafka+Zookeeper for one VM). rsyslog forwards a JSON copy of
#                every line here.
#   clickhouse - column store for the classified/parsed log events. Chosen
#                over Elasticsearch/OpenSearch at this volume for lower RAM
#                use and much cheaper high-cardinality aggregation queries.
#   classifier - Python consumer: Kafka -> Drain3 template mining ->
#                ML severity/category classifier -> ClickHouse.
#   grafana    - dashboards on top of ClickHouse.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: syslog-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: syslog-clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"   # HTTP interface (used by Grafana + the consumer)
      - "9000:9000"   # native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  classifier:
    build: ./ml
    container_name: syslog-classifier
    depends_on:
      - redpanda
      - clickhouse
    environment:
      KAFKA_BROKER: "redpanda:9092"
      KAFKA_TOPIC: "syslog.raw"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      MODEL_PATH: "/models/classifier.joblib"
    volumes:
      - ./ml:/app
      - model_data:/models
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: syslog-grafana
    depends_on:
      - clickhouse
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped

volumes:
  redpanda_data:
  clickhouse_data:
  grafana_data:
  model_data:
