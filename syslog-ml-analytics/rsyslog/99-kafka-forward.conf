# Drop this into /etc/rsyslog.d/ on your VM (or wherever rsyslog receives the
# syslog feed today) and restart rsyslog. It does NOT replace your existing
# LogAnalyzer pipeline — it adds a second output that mirrors every message
# as JSON onto a Kafka/Redpanda topic for the ML pipeline. Your current
# LogAnalyzer database keeps receiving logs exactly as before.
#
# Requires the omkafka module, available in rsyslog >= 8.7 (package:
# rsyslog-kafka on RHEL/Debian derivatives).

module(load="omkafka")

template(name="json_syslog" type="list" option.jsonf="on") {
    property(outname="timestamp"   name="timereported"        dateFormat="rfc3339" format="jsonf")
    property(outname="host"        name="hostname"                                 format="jsonf")
    property(outname="facility"    name="syslogfacility-text"                      format="jsonf")
    property(outname="severity"    name="syslogseverity-text"                      format="jsonf")
    property(outname="program"     name="programname"                              format="jsonf")
    property(outname="pid"         name="procid"                                   format="jsonf")
    property(outname="message"     name="msg"                                      format="jsonf")
    property(outname="raw"         name="rawmsg"                                   format="jsonf")
}

# Adjust broker to the VM's own address if redpanda isn't on localhost.
action(
    type="omkafka"
    broker=["localhost:9092"]
    topic="syslog.raw"
    template="json_syslog"
    confParam=[
        "compression.codec=snappy",
        "queue.buffering.max.messages=100000"
    ]
    action.resumeRetryCount="-1"
)
